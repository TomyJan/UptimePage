function disclaimer(){return `<div class="disclaimer"><p>${t('note')}</p><span>${t('updated')} <time class="mono">${time()}</time></span></div>`}
function homepage(){const ms=monitors(),down=ms.filter(m=>m.status==='down').length,up=ms.filter(m=>m.status==='operational'&&!m.stale).length,other=ms.length-up-down;const subs=group==='core'?['all','web','api','infra']:['all','tools','cloud'];return `<main id="main" class="shell" tabindex="-1"><section class="intro"><div><div class="eyebrow">${t('eyebrow')} / ${group==='core'?'01':'02'}</div><h1>${t(direction==='c'?'cTitle':'title')}</h1><p>${t('subtitle')}</p></div><div class="live"><i class="dot"></i>${t('live')}</div></section><div class="group-tabs" role="tablist" aria-label="${language()==='zh'?'大分组':'Groups'}">${['core','external'].map((g,i)=>`<button role="tab" aria-selected="${group===g}" aria-controls="monitor-content" id="group-${g}" tabindex="${group===g?0:-1}" data-group="${g}" class="${group===g?'active':''}"><span class="logo">${icon(i?'globe':'grid',14)}</span>${t('group'+(i+1))}<span class="count">${monitors(g).length}</span></button>`).join('')}</div><section class="overview" aria-label="${t('overview')}"><span class="status-icon" ${down?'':'style="color:var(--good);background:var(--good-bg)"'}>${icon(down?'alert':'check',22)}</span><div><h2 class="overview-title">${t(down?'some':'healthy')}</h2><p>${t('overview')}</p></div><div class="overview-counts"><div><strong>${up}</strong><small>${t('normalCount')}</small></div><div class="failure"><strong>${down}</strong><small>${t('faultCount')}</small></div><div class="unknown"><strong>${other}</strong><small>${t('otherCount')}</small></div></div></section><div class="sub-row"><div class="sub-tabs" role="tablist" aria-label="${language()==='zh'?'子分组':'Subgroups'}">${subs.map((s,i)=>`<button role="tab" aria-selected="${sub===s}" aria-controls="monitor-content" id="sub-${s}" tabindex="${sub===s?0:-1}" data-sub="${s}" class="${sub===s?'active':''}">${i?`<span class="logo">${{web:'W',api:'A',infra:'I',tools:'T',cloud:'C'}[s]}</span>`:''}${t(s)}<span class="sub-count">${s==='all'?ms.length:ms.filter(m=>m.sub===s).length}</span></button>`).join('')}</div><label class="search">${icon('search',14)}<input id="search" type="search" placeholder="${t('search')}" aria-label="${t('search')}" autocomplete="off"></label></div><div class="list-head"><div class="list-title">${t('services')} <span class="muted mono" id="visible-count">${visibleMonitors().length}</span></div><div class="list-actions"><label class="pin-toggle"><input type="checkbox" id="pin" ${pinned?'checked':''}>${t('pin')}</label><button class="refresh" id="refresh" ${refreshing?'disabled':''}>${icon('refresh',13)}${t(refreshing?'refreshing':'refresh')}</button></div></div><div class="history-caption"><span>${t('history')}</span><div class="legend"><span><i></i>${t('legendGood')}</span><span><i class="bad"></i>${t('legendBad')}</span><span><i class="none"></i>${t('legendNone')}</span></div></div><div id="monitor-content" role="tabpanel" aria-labelledby="sub-${sub}" class="monitors">${listMarkup()}</div>${disclaimer()}</main>`}
function chart(m){if(m.latency===null)return `<div class="empty">${t('noResponse')}</div>`;const width=innerWidth<=800?Math.max(240,innerWidth-74):890;const nums=Array.from({length:65},(_,i)=>m.latency+Math.round(20*Math.sin((i+m.seed+Number(windowSize))*2.2)+12*Math.cos(i/4))+((i+m.seed)%17===0?80:0));const points=nums.map((n,i)=>`${40+i*(width-40)/64},${160-(n/(m.latency+150))*130}`).join(' ');return `<svg class="chart" viewBox="0 0 ${width} 190" preserveAspectRatio="none" role="img" aria-label="${t('response')} · ${t('average')} ${m.latency+12} ms"><title>${t('response')} — ${t('average')} ${m.latency+12} ms</title>${[30,80,130,180].map((y,i)=>`<line class="grid" x1="40" x2="${width}" y1="${y}" y2="${y}"/><text x="0" y="${y+4}">${Math.round((m.latency+150)*(1-i/3))}</text>`).join('')}<polyline points="${points}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg><div class="chart-labels">${[0,1,2,3].map(i=>`<span>${new Intl.DateTimeFormat(language()==='zh'?'zh-CN':'en-GB',{...(windowSize==='24'?{hour:'2-digit',minute:'2-digit',hour12:false}:{month:'2-digit',day:'2-digit'}),timeZone:getZone()}).format(new Date(refreshedAt.getTime()-(windowSize==='24'?1:Number(windowSize))*86400000*(1-i/3)))}</span>`).join('')}</div>`}
function detail(g,id){const m=monitors(g).find(m=>m.id===id);if(!m)return `<main id="main" class="shell detail-shell"><a class="back" href="#/">${icon('back')}${t('back')}</a><div class="empty">${t('empty')}</div></main>`;if(group!==g){group=g;sub='all';query=''}return `<main id="main" class="shell detail-shell" tabindex="-1"><a class="back" href="#/">${icon('back')}${t('back')}<span class="muted">/ ${t(g==='core'?'group1':'group2')}</span></a><section class="detail-heading"><div class="detail-title"><div class="service-logo">${m.logo}</div><div><div class="eyebrow">${t('details')}</div><h1>${displayName(m)}</h1><p>${m.host}</p></div></div><div class="detail-state">${status(m)}</div></section>${m.stale||m.status==='down'?`<div class="detail-alert">${t(m.stale?'staleNote':'downNote')}</div>`:''}<div class="detail-metrics">${[[t('uptime'),m.uptime===null?'—':m.uptime+'%',t(m.uptime===null?'noPercentage':'window24')],[t('latency'),m.latency===null?'—':m.latency+' ms',m.stale?t('lastKnown'):t(m.latency===null?'noLatency':'lastCheck')],[t('average'),m.latency===null?'—':(m.latency+12)+' ms',t(m.latency===null?'noLatency':'window24')],[t('certificate'),m.cert===null?'—':m.cert+' '+t('days'),t(m.cert===null?'certNone':'valid')]].map(([label,value,note])=>`<div><small>${label}</small><strong>${value}</strong><span>${note}</span></div>`).join('')}</div><section class="panel"><div class="panel-top"><h2>${t('response')} <span class="muted mono" style="font-size:11px;font-weight:400">ms</span></h2><div class="window-tabs" aria-label="${t('response')}">${['24','7','30'].map(w=>`<button data-window="${w}" aria-pressed="${w===windowSize}" class="${w===windowSize?'active':''}">${t('window'+w)}</button>`).join('')}</div></div>${chart(m)}</section><section class="panel"><div class="panel-top"><h2>${t('history')}</h2><span class="muted mono" style="font-size:12px">${m.uptime===null?'—':m.uptime+'%'}</span></div><div class="bars" style="height:32px" role="img" aria-label="${t('history')} · ${m.uptime===null?t('noHistory'):m.uptime+'%'}">${history(m,60)}</div><div class="history-meta"><span>${t('ago')}</span><span>${t('now')}</span></div></section><div class="detail-bottom"><section class="panel"><div class="panel-top"><h2>${t('events')}</h2></div>${m.status==='down'?`<div class="event"><time>${time(new Date(refreshedAt.getTime()-34*60000))}</time><div>${t('eventTitle')}<p>${t('eventBody')}</p></div></div><div class="event"><time>${time(new Date(refreshedAt.getTime()-4*60000))}</time><div>${t('down')}<p>${t('downNote')}</p></div></div>`:`<p class="muted" style="font-size:12px">${m.status==='paused'?t('noHistory'):t('noEvents')}</p>`}</section><section class="panel"><div class="panel-top"><h2>${t('information')}</h2></div><dl class="facts"><dt>${t('type')}</dt><dd class="mono">HTTPS</dd><dt>${t('interval')}</dt><dd>${t('everyMinute')}</dd><dt>${t('dataSource')}</dt><dd>${g==='core'?'Peekaping':'UptimeRobot'}</dd><dt>${t('lastCheck')}</dt><dd class="mono">${m.stale?'—':time()}</dd></dl></section></div>${disclaimer()}</main>`}
function render(){applyTheme();const route=location.hash.match(/^#\/services\/(core|external)\/(m\d+)$/);$('#app').innerHTML=nav()+(route?detail(route[1],route[2]):homepage())+footer();if($('#search'))$('#search').value=query;bind();const notes={a:'<strong>A · 清晰留白（推荐）</strong>　Vercel 的中性色与留白 + 公开状态页的状态层级。首页保留历史、可用率和响应时间。',b:'<strong>B · 紧凑控制台</strong>　Linear 的深色与紧密网格。更矮的行卡、对齐的数据列，适合高频查看较多监控。',c:'<strong>C · 暖色目录</strong>　Aesop 的暖白与非对称排版。左侧说明、右侧卡片，首页突出可用率，响应数据进入详情。'};$('#direction-note').innerHTML=notes[direction]}
function persist(){try{localStorage.setItem('uptimepage-design-prefs',JSON.stringify(prefs))}catch{}}
function bind(){
 $$('[data-pref]').forEach(el=>el.onchange=()=>{prefs[el.dataset.pref]=el.value;persist();render()});
 $$('.pref').forEach(el=>el.addEventListener('toggle',()=>{if(el.open)$$('.pref').filter(d=>d!==el).forEach(d=>d.open=false)}));
 $$('[data-group]').forEach(el=>el.onclick=()=>{group=el.dataset.group;sub='all';query='';render()});
 $$('[data-sub]').forEach(el=>el.onclick=()=>{sub=el.dataset.sub;query='';render()});
 $$('[role=tablist]').forEach(list=>list.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let tabs=$$('[role=tab]',list),i=tabs.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;const key=tabs[i].dataset.group?'group':'sub',value=tabs[i].dataset[key];tabs[i].click();$(`[data-${key}="${value}"]`).focus()});
 if($('#search'))$('#search').oninput=e=>{query=e.target.value;refreshList()};
 if($('#pin'))$('#pin').onchange=e=>{pinned=e.target.checked;refreshList()};
 if($('#refresh'))$('#refresh').onclick=()=>{refreshing=true;render();setTimeout(()=>{refreshing=false;refreshedAt=new Date();render();toast(t('refreshDone'))},500)};
 $$('[data-window]').forEach(el=>el.onclick=()=>{windowSize=el.dataset.window;render();$(`[data-window="${windowSize}"]`).focus()});
}
let toastTimer;function toast(message){clearTimeout(toastTimer);$('#feedback').innerHTML=`<div class="toast">${message}</div>`;toastTimer=setTimeout(()=>$('#feedback').innerHTML='',3500)}
 $$('.directions button').forEach(el=>el.onclick=()=>{direction=el.dataset.direction;$$('.directions button').forEach(b=>{b.classList.toggle('active',b===el);b.setAttribute('aria-pressed',b===el)});render()});
 $('#sample-size').onchange=e=>{sampleSize=Number(e.target.value);render()};
 document.addEventListener('click',e=>{if(!e.target.closest('.pref'))$$('.pref').forEach(d=>d.open=false)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('.pref').filter(d=>d.open).forEach(d=>{d.open=false;$('summary',d).focus()})});
 window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main')?.focus({preventScroll:true})});
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!prefs.theme||prefs.theme==='auto')applyTheme()});
 window.addEventListener('languagechange',()=>{if(!prefs.lang||prefs.lang==='auto')render()});
 setInterval(()=>{if(document.hidden||refreshing)return;refreshedAt=new Date();$$('.disclaimer time').forEach(el=>el.textContent=time())},60000);
 render();
</script>
</body>
</html>
