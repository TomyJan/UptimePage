<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配置编辑器 · 原独立页方案</title></head><body><style>
  :root { --ink:#20233a; --muted:#747893; --line:#e4e6f0; --surface:#fff; --soft:#f7f7fb; --accent:#5967d9; --accent-soft:#eef0ff; --good:#378a63; --bad:#bd4e64; }
  * { box-sizing:border-box; }
  body { margin:0; background:linear-gradient(145deg,#f7f8ff,#f4f5fb); color:var(--ink); font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif; }
  .page { max-width:1120px; margin:0 auto; padding:34px 28px 70px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
  .back { color:var(--muted); font-size:13px; } .back:hover { color:var(--accent); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; } .mark { width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--accent); color:#fff; }
  h1 { margin:0; font-size:29px; letter-spacing:-.7px; } .sub { margin:7px 0 0; color:var(--muted); }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 310px; gap:18px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 28px #37407d12; }
  .editor { padding:18px; } .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  button,.file { display:inline-flex; align-items:center; gap:7px; min-height:36px; border:1px solid var(--line); border-radius:10px; padding:7px 12px; background:var(--surface); color:var(--ink); font:inherit; cursor:pointer; }
  button:hover,.file:hover { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .primary { background:var(--accent); border-color:var(--accent); color:#fff; } .primary:hover { color:#fff; background:#4e5dcb; }
  textarea { width:100%; height:560px; resize:vertical; border:1px solid var(--line); border-radius:13px; padding:16px; background:#fbfbfe; color:var(--ink); font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace; outline:none; }
  textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px #5967d91c; } .hint { color:var(--muted); font-size:12px; margin:10px 2px 0; }
  .side { padding:20px; } .side h2 { margin:0 0 12px; font-size:15px; } .side p { margin:0 0 14px; color:var(--muted); font-size:13px; } .step { display:flex; gap:11px; margin:15px 0; } .num { flex:0 0 24px; height:24px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); border-radius:8px; font-weight:700; font-size:12px; }
  .result { margin-top:14px; padding:11px 12px; border-radius:10px; background:#eef8f2; color:var(--good); font-size:13px; } .error { margin-top:14px; padding:11px 12px; border-radius:10px; background:#fff0f3; color:var(--bad); font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; }
  @media (max-width:760px) { .page { padding:22px 16px 50px; } .top { align-items:flex-start; flex-direction:column-reverse; } .layout { grid-template-columns:1fr; } textarea { height:430px; } .bar button,.bar .file { flex:1 1 calc(50% - 8px); justify-content:center; } }
</style>
<div class="page">
  <div class="top"><a class="back" href="#">← 返回状态页</a><div class="brand"><span class="mark">⌁</span> UptimePage</div></div>
  <div style="margin-bottom:24px"><h1>配置编辑器</h1><p class="sub">在本地编辑、校验，然后下载 site.json。</p></div>
  <div class="layout">
    <section class="card editor">
      <div class="bar"><button>✦ 加载模板</button><label class="file">▣ 导入 JSON<input type="file" hidden></label><button>格式化</button><button class="primary">✓ 校验配置</button><button>复制</button><button>⇩ 下载 site.json</button></div>
      <textarea spellcheck="false">{
  "site": {
    "name": { "en": "My status page", "zh-CN": "我的状态页" },
    "nav": [],
    "refreshIntervalSeconds": 60
  },
  "groups": [
    { "id": "core", "name": "Services", "source": { "type": "peekaping" } }
  ]
}</textarea>
      <div class="hint">不会自动上传、保存或访问来源。你确认后下载文件，再提交到仓库部署。</div>
      <div class="result">✓ 配置有效，可以下载</div>
    </section>
    <aside class="card side"><h2>使用方式</h2><p>编辑器只在当前浏览器内工作，适合维护公开配置文件。</p><div class="step"><span class="num">1</span><span>加载模板，或导入已有的 site.json</span></div><div class="step"><span class="num">2</span><span>修改网站、来源、分组和监控选择</span></div><div class="step"><span class="num">3</span><span>校验通过后下载，再提交并部署</span></div><p style="margin-top:20px">编辑器不会显示在首页导航中。和状态页一起部署，访问隐藏的 <b>/editor</b> 路径即可。</p></aside>
  </div>
</div>
</body></html>
