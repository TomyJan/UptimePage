.edit-band{height:36px;min-height:36px;padding:0 20px;background:var(--edit-top);border-bottom:1px solid #ffffff26;box-shadow:0 3px 14px #3e2c6c24;font-size:11px;transition:opacity .3s,translate .4s var(--ease)}
.edit-badge{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:650;background:#ffffff18;border:1px solid #ffffff36;border-radius:5px;padding:2px 7px;letter-spacing:.06em}
.edit-badge:before{content:'';width:5px;height:5px;background:#f2cb70;border-radius:50%}
.band-main{gap:12px!important}.band-extra{opacity:.78}.band-actions{font-size:10px}.band-actions button{font-size:10px;padding:3px 8px;border:1px solid #ffffff25;border-radius:6px;background:#ffffff0a;transition:background .2s,border-color .2s}.band-actions button:hover{background:#ffffff23;border-color:#ffffff50}
.bottom-band{height:30px;min-height:30px;align-items:center;padding:0 20px;background:var(--edit-bottom);color:var(--edit-bottom-ink);border-color:color-mix(in srgb,var(--edit-bottom-ink) 15%,transparent);font-size:10px;box-shadow:0 -2px 12px #4d34100a;transition:opacity .3s,translate .4s var(--ease)}
.bottom-mode{display:flex;align-items:center;gap:7px;font-weight:600}.banner-signal{width:5px;height:5px;display:inline-block;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px #5137100b}
.site-nav{margin-top:36px;transition:margin-top .42s var(--ease),background-color .28s,border-color .28s}body.preview-off .site-nav{margin-top:0}
.editor{height:var(--editor-height);bottom:48px;--peek:36px;transition:transform .56s var(--ease),right .56s var(--ease),box-shadow .4s,opacity .3s,background-color .28s,border-color .28s;will-change:transform}
.editor-inner{height:100%;display:flex;flex-direction:column;opacity:1;visibility:visible;transition:none}
.editor.docked{background:var(--surface);border-color:var(--line);box-shadow:-5px 6px 26px #26203317;pointer-events:auto}
.editor.docked .editor-inner{opacity:1;visibility:visible;pointer-events:none;transition:none}
.dock-tab{left:0;top:0;bottom:0;height:auto;width:36px;z-index:5;background:var(--surface);border-right:1px solid var(--line);border-radius:17px 0 0 17px;transition:opacity .2s,visibility 0s .2s}
.editor.docked .dock-tab{height:100%;top:0;bottom:0;transform:none;box-shadow:none;background:var(--surface);border:0;border-right:1px solid var(--line);pointer-events:auto}
.dock-tab svg{opacity:.65}.dock-tab span{font-size:10px}.dock-tab #dockDirty{font-size:8px}
.editor-head{height:55px;min-height:55px;padding:0 16px;overflow:visible}
.mode-row{height:45px;min-height:45px;padding:0 16px 10px;display:flex;align-items:center;justify-content:flex-start}
.mode-switch{position:relative;padding:3px;width:148px;height:32px;isolation:isolate}.mode-switch button{width:50%;padding:4px 0;z-index:1;position:relative;background:none!important;box-shadow:none!important;transition:color .3s}
.mode-cursor{position:absolute;left:3px;top:3px;bottom:3px;width:calc(50% - 3px);border-radius:6px;background:var(--surface);box-shadow:0 2px 5px #29213d0b;transition:transform .4s var(--ease)}
.mode-switch.json-selected .mode-cursor{transform:translateX(100%)}
.editor-stage{flex:1;min-height:0;position:relative;isolation:isolate;overflow:hidden}
.mode-pane{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(14px);transition:opacity .28s ease,transform .42s var(--ease),visibility 0s .42s}
.form-pane{transform:translateX(-14px)}.mode-pane.active{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0);transition:opacity .28s .08s,transform .42s var(--ease),visibility 0s}
.editor-categories{height:42px;min-height:42px;position:relative;gap:19px;padding:0 16px;align-items:center;overflow:hidden}
.category{padding:0;align-self:stretch;display:flex;align-items:center;border:0;font-size:11px;transition:color .3s}.category-cursor{position:absolute;bottom:0;height:2px;left:0;border-radius:2px;background:var(--accent);transition:width .4s var(--ease),transform .4s var(--ease);pointer-events:none}
.editor-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding:16px;overflow-x:hidden}
.pane-enter{animation:none}.field .key{display:none}.section-title{margin-top:19px}.hint{font-size:10px}.service{animation:none}.icon-btn{transition:color .22s,background .22s,transform .3s var(--ease)}.icon-btn:active{transform:scale(.91)}
.json-pane{height:auto}.json-tools{height:42px;min-height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 13px 0 17px;border-bottom:1px solid var(--line)}.json-filename{font-size:10px;color:var(--muted)}.json-tool-buttons{display:flex;gap:3px}.json-tool-buttons .icon-btn{width:30px;height:28px;font-size:11px}
.json-workspace{flex:1;min-height:0;padding:13px 16px 16px;display:flex}.json-input{height:100%;min-height:0;flex:1;line-height:1.75;background:var(--soft);transition:background-color .28s,border-color .28s}
.editor-status{height:36px;min-height:36px;max-height:36px;align-items:center;padding:0 16px;overflow:hidden;background:var(--surface);color:var(--muted)}.editor-status svg{color:var(--good);margin:0}.editor-status.bad svg{color:var(--bad)}.editor-status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.editor-status.bad{color:var(--bad);background:var(--bad-soft)}
.editor-foot{height:55px;min-height:55px;padding:0 16px}.editor-foot .mono{font-size:10px;opacity:.75}.editor-foot .btn{min-height:32px;font-size:11px}.editor-foot .btn svg{width:14px;height:14px}
.form-meta{margin-bottom:15px}.toast-stack{top:47px}.popup-menu{z-index:90;animation:none;transform-origin:top right;min-width:138px}.editor-head .menu-wrap{z-index:90}.nested-card{transition:background .25s,border-color .25s}
@supports(interpolate-size:allow-keywords){details{interpolate-size:allow-keywords}details::details-content{block-size:0;opacity:0;overflow:clip;transition:block-size .36s var(--ease),opacity .24s,content-visibility .36s allow-discrete}details[open]::details-content{block-size:auto;opacity:1}}
@media(max-width:600px){:root{--editor-height:min(660px,calc(100dvh - 106px))}.edit-band{height:34px;min-height:34px;padding:0 12px;font-size:10px}.edit-band .band-extra{display:none}.edit-badge{font-size:9px}.band-actions{gap:5px}.band-actions button{font-size:9px;padding:3px 5px}.bottom-band{height:28px;min-height:28px;padding:0 12px;font-size:9px}.site-nav{margin-top:34px}.editor{bottom:39px;--peek:32px!important}.dock-tab{width:32px}.editor-head{height:51px;min-height:51px;padding:0 13px}.mode-row{padding-left:13px;padding-right:13px}.editor-categories{padding:0 13px;gap:17px}.editor-scroll{padding:14px 13px}.json-workspace{padding:12px 13px 14px}.json-tools{padding:0 11px 0 13px}.editor-status,.editor-foot{padding-left:13px;padding-right:13px}.toast-stack{top:44px}.editor-foot .btn{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

.ui-tip{position:fixed;z-index:95;max-width:210px;pointer-events:none;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);box-shadow:0 5px 20px #26203312;font-size:10px;opacity:0;translate:0 4px;transition:opacity .16s,translate .22s var(--ease)}.ui-tip.visible{opacity:1;translate:0 0}
.ui-tip{visibility:hidden;transition:opacity .16s,translate .22s var(--ease),visibility 0s .16s}.ui-tip.visible{visibility:visible;transition-delay:0s}
</style>
</head>
<body>
<div class="edit-band"><div class="band-main"><span class="edit-badge">编辑模式</span><span class="band-extra">模拟数据</span></div><div class="band-actions"><span id="bandState">尚未修改</span><button id="showEditor">编辑配置</button><button id="exitPreview">退出预览</button></div></div>
<header class="site-nav"><div class="nav-inner"><a class="brand" href="#" id="brand"></a><div class="nav-right"><nav class="nav-links" id="previewNav"></nav><div class="nav-tools"><button class="icon-btn" id="previewLocale" aria-label="切换预览语言" title="切换预览语言">EN</button><button class="icon-btn" id="previewTheme" aria-label="切换明暗外观" title="切换明暗外观"></button></div></div></div></header>
<main class="shell" id="previewMain"></main>
<footer class="site-footer"><span>Powered by <a href="https://github.com/TomyJan/UptimePage" target="_blank">UptimePage</a> <span class="mono">dev</span> | <a href="https://vov.moe" target="_blank">TomyJan</a></span><span id="previewFooter"></span></footer>
<div class="bottom-band"><span class="bottom-mode"><span class="banner-signal"></span>本地预览</span><span id="bottomState">导出配置后部署生效</span></div>
<aside class="editor" id="editor" aria-label="配置编辑器">
  <button class="dock-tab" id="dockTab" aria-label="展开配置编辑器"><svg><use href="#i-edit"/></svg><span>编辑配置</span><span id="dockDirty">○</span></button>
  <div class="editor-inner" id="editorInner">
    <div class="editor-head"><div class="editor-title"><span class="editor-mark"><svg><use href="#i-edit"/></svg></span><strong>配置编辑器</strong></div><div class="editor-controls"><div class="menu-wrap"><button class="icon-btn" id="moreMenu" title="更多操作" aria-label="更多操作" aria-expanded="false"></button><div class="popup-menu" id="menu" hidden><button id="resetConfig">恢复示例</button><button id="oldPrototype">原独立页方案</button></div></div><button class="icon-btn" id="pinEditor" aria-label="固定展开" title="固定展开" aria-pressed="false"></button><button class="icon-btn" id="dockEditor" aria-label="收起贴边" title="收起贴边"></button></div></div>
    <div class="mode-row"><div class="segmented mode-switch" id="modes"><span class="mode-cursor" aria-hidden="true"></span><button class="active" data-mode="form">表单</button><button data-mode="json">JSON</button></div></div>
    <div class="editor-stage" id="editorBody">
      <section class="mode-pane form-pane active" id="formPane" aria-label="表单配置">
        <nav class="editor-categories" id="categories"><button class="category active" data-category="site">网站</button><button class="category" data-category="groups">分组与来源</button><button class="category" data-category="monitors">监控显示</button><button class="category" data-category="cache">缓存</button><span class="category-cursor" id="categoryCursor" aria-hidden="true"></span></nav>
        <div class="editor-scroll" id="formBody"></div>
      </section>
      <section class="mode-pane json-pane" id="jsonPane" aria-label="JSON 配置" inert>
        <div class="json-tools"><span class="json-filename mono">site.json</span><div class="json-tool-buttons"><button class="icon-btn" id="pasteIntoJSON" aria-label="粘贴 JSON" title="粘贴"></button><button class="icon-btn" id="importConfig" aria-label="导入 JSON 文件" title="导入文件"></button><button class="icon-btn" id="copyConfig" aria-label="复制 JSON" title="复制"></button><button class="icon-btn" id="formatConfig" aria-label="格式化 JSON" title="格式化">{ }</button></div></div>
        <div class="json-workspace"><textarea class="json-input" id="jsonInput" spellcheck="false" aria-label="完整 JSON 配置" placeholder="粘贴或编辑 JSON"></textarea></div>
      </section>
    </div>
    <div class="editor-status" id="editorStatus" role="status"></div>
    <div class="editor-foot"><span id="draftStatus"></span><button class="btn primary" id="exportConfig"></button></div>
  </div>
</aside>
<button class="btn primary restore-card" id="restoreEditor" hidden>重新进入编辑预览</button>
<input type="file" id="configFile" accept="application/json,.json" hidden>
<div class="toast-stack" id="toasts" aria-live="polite"></div><div class="ui-tip" id="uiTip" role="tooltip"></div>

}else if(category==='groups'){html+=groupPicker()+`<div class="card-tools"><span>大分组</span><div class="tools-right">${miniBtn('up','up-group',editGroup,'上移大分组',editGroup===0)}${miniBtn('down','down-group',editGroup,'下移大分组',editGroup===draft.groups.length-1)}${miniBtn('trash','remove-group',editGroup,'删除大分组',draft.groups.length===1)}</div></div><div class="two-cols">${field('ID','id',group.id,{path:p+'.id',mono:true})}${localizedField('显示名称',p+'.name',group.name)}</div>`+field('Logo','logo',group.logo,{path:p+'.logo',nullable:true})+`<div class="section-title"><span>数据来源</span></div><div class="source-options"><button data-source="peekaping" class="${group.source.type==='peekaping'?'active':''}">Peekaping</button><button data-source="uptimerobot" class="${group.source.type==='uptimerobot'?'active':''}">UptimeRobot</button></div>`+(group.source.type==='peekaping'?field('实例地址','baseUrl',group.source.baseUrl,{path:p+'.source.baseUrl'}):'')+field('密钥环境变量名','apiKeyEnv',group.source.apiKeyEnv,{path:p+'.source.apiKeyEnv',mono:true})+`<div class="hint">仅填变量名，密钥在 EO 设置。</div><div class="section-title"><span>子分组</span><button class="btn" data-mutation="add-sub">＋ 添加</button></div>`+group.subgroups.map((s,i)=>`<div class="nested-card"><div class="card-tools"><span>${esc(text(s.name,editLocale))}</span><div class="tools-right">${miniBtn('up','up-sub',i,'上移子分组',i===0)}${miniBtn('down','down-sub',i,'下移子分组',i===group.subgroups.length-1)}${miniBtn('trash','remove-sub',i,'删除子分组')}</div></div><div class="two-cols">${field('ID','id',s.id,{path:`${p}.subgroups.${i}.id`,mono:true})}${localizedField('名称',`${p}.subgroups.${i}.name`,s.name)}</div>${field('Logo · 独立配置','logo',s.logo,{path:`${p}.subgroups.${i}.logo`,nullable:true})}${group.source.type==='peekaping'?field('状态页别名','slug',s.slug,{path:`${p}.subgroups.${i}.slug`,mono:true}):field('监控 ID · 每行一个，或 *','monitorIds',(s.monitorIds||[]).join('\n'),{path:`${p}.subgroups.${i}.monitorIds`,area:true,list:true})}<details><summary>监控顺序</summary>${field('优先显示的 ID · 每行一个','order',(s.order||[]).join('\n'),{path:`${p}.subgroups.${i}.order`,area:true,list:true})}</details></div>`).join('');
}else if(category==='monitors'){html+=groupPicker()+`<div class="section-title"><span>监控显示覆盖</span><button class="btn" data-mutation="add-monitor">＋ 添加</button></div><div class="hint">仅覆盖显示，不改变公开范围。</div>`+Object.entries(group.monitors||{}).map(([id,m],i)=>`<div class="nested-card"><div class="card-tools"><span class="mono">${esc(id)}</span>${miniBtn('trash','remove-monitor',i,'删除显示覆盖')}</div>${field('上游监控 ID','monitor ID',id,{path:'',mono:true}).replace('data-path="monitor ID"',`data-monitor-id="${esc(id)}"`)}${localizedField('显示名称',`${p}.monitors.${id}.name`,m.name)}${field('Logo','logo',m.logo,{path:`${p}.monitors.${id}.logo`,optional:true})}${localizedField('描述',`${p}.monitors.${id}.description`,m.description)}</div>`).join('');
}else{html+=`<div class="section-title"><span>跨节点缓存</span><span class="pill">可选</span></div>`+toggle('启用 KV 绑定','cache-enabled',!!draft.cache?.kvBinding)+(draft.cache?.kvBinding?field('EO 绑定变量名','kvBinding',draft.cache.kvBinding,{path:'cache.kvBinding',mono:true}):'')+`<div class="hint">与 EO 的 KV 绑定变量名一致。</div>`;}
$('formBody').innerHTML=`<div>${html}</div>`;}

const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const swaps=new WeakMap();
function swapContent(element,render){
  const computed=getComputedStyle(element),fromOpacity=computed.opacity,fromTransform=computed.transform;const previous=swaps.get(element);if(previous){previous.cancelled=true;for(const a of element.getAnimations())a.cancel()}
  const task={cancelled:false};swaps.set(element,task);
  const show=()=>{if(task.cancelled)return;const before=element.getBoundingClientRect().height;render();const after=element.getBoundingClientRect().height;if(reduced())return;element.animate([{opacity:0,transform:'translateY(7px)'},{opacity:1,transform:'translateY(0)'}],{duration:360,easing:'cubic-bezier(.22,.8,.22,1)'});if(Math.abs(after-before)>2)element.animate([{height:before+'px'},{height:after+'px'}],{duration:380,easing:'cubic-bezier(.22,.8,.22,1)'});};
  if(reduced()||!element.children.length){show();return}
  element.animate([{opacity:fromOpacity,transform:fromTransform},{opacity:0,transform:'translateY(-5px)'}],{duration:140,easing:'ease-out'}).finished.then(show).catch(()=>{});
}
function moveCategory(){const button=$('categories').querySelector('.active');if(button){$('categoryCursor').style.width=button.offsetWidth+'px';$('categoryCursor').style.transform='translateX('+button.offsetLeft+'px)'}}
function renderEditor(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  $('modes').classList.toggle('json-selected',mode==='json');
  for(const [id,isActive]of [['formPane',mode==='form'],['jsonPane',mode==='json']]){$(id).classList.toggle('active',isActive);$(id).inert=!isActive}
  if(mode==='json'){$('jsonInput').value=jsonText;$('jsonInput').classList.toggle('invalid',!!errors.length)}
  else{document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b.dataset.category===category));swapContent($('formBody'),renderForm);moveCategory()}
}
window.addEventListener('resize',moveCategory);
function pathParts(path){const match=/^groups\.(\d+)\.monitors\.(.+)\.(name|logo|description)$/.exec(path);return match?['groups',match[1],'monitors',match[2],match[3]]:path.split('.');}
function getPath(obj,path){return pathParts(path).reduce((o,k)=>o&&Object.hasOwn(o,k)?o[k]:undefined,obj)}
function setPath(path,value){const parts=pathParts(path);let object=draft;for(let i=0;i<parts.length-1;i++){if(!Object.hasOwn(object,parts[i])||object[parts[i]]===null)Object.defineProperty(object,parts[i],{value:{},writable:true,enumerable:true,configurable:true});object=object[parts[i]]}const key=parts.at(-1);if(value===undefined)delete object[key];else Object.defineProperty(object,key,{value,writable:true,enumerable:true,configurable:true});}
function fieldInput(input){const path=input.dataset.path;if(!path)return;let value=input.value;if(input.dataset.localized){const old=getPath(draft,path);value=localized(old,value);if(!input.value&&path.includes('.monitors.'))value=undefined;if(path==='site.footer'&&!input.value)value='';}else if(input.type==='number')value=input.value===''?-1:Number(value);else if(input.dataset.list)value=value.split(/[\n,]/).map(v=>v.trim()).filter(Boolean);else if(input.dataset.nullable&&!value)value=null;else if(input.dataset.optional&&!value)value=undefined;setPath(path,value);sync();}
function parseJSON(){jsonText=$('jsonInput').value;try{const value=JSON.parse(jsonText);errors=validate(value);if(!errors.length){draft=clone(value);valid=clone(value);editGroup=Math.min(editGroup,draft.groups.length-1);renderPreview();}}catch(e){errors=['JSON 格式错误：'+e.message]}updateStatus();$('jsonInput').classList.toggle('invalid',!!errors.length);}
function prepareExport(){if(errors.length){toast('请先修正配置错误');return null}return mode==='json'?jsonText:JSON.stringify(draft,null,2);}
async function paste(){mode='json';renderEditor();$('jsonInput').focus();try{if(!navigator.clipboard?.readText)throw new Error('clipboard unavailable');const value=await navigator.clipboard.readText();if(value){$('jsonInput').value=value;parseJSON();toast(errors.length?'已粘贴，配置待修正':'已粘贴');}}catch{toast('请在 JSON 输入框中按 Ctrl / ⌘ + V 粘贴')}}
function dock(force=false){if(!active||(!force&&(pinned||$('editor').matches(':hover')||$('editor').contains(document.activeElement))))return;docked=true;$('editor').classList.add('docked');$('editorInner').inert=true;$('pinEditor').setAttribute('aria-pressed',pinned);}
function expand(){clearTimeout(timer);docked=false;$('editorInner').inert=false;$('editor').classList.remove('docked');}
function scheduleDock(){clearTimeout(timer);timer=setTimeout(()=>dock(),850);}
function mutation(action,index){const g=draft.groups[editGroup];const generate=(prefix,existing)=>{let i=1;while(existing.includes(prefix+i))i++;return prefix+i};const move=(array,i,d)=>{if(i+d<0||i+d>=array.length)return;[array[i],array[i+d]]=[array[i+d],array[i]]};
if(action==='add-nav'){draft.site.nav??=[];draft.site.nav.push({label:{en:'New link','zh-CN':'新链接'},href:'https://example.com',newTab:true});}
if(action==='remove-nav')draft.site.nav.splice(index,1);
if(action==='up-nav')move(draft.site.nav,index,-1);if(action==='down-nav')move(draft.site.nav,index,1);
if(action==='add-group'){draft.groups.push({id:generate('group-',draft.groups.map(g=>g.id)),name:{en:'New group','zh-CN':'新分组'},logo:null,source:{type:'peekaping',baseUrl:'https://monitor.example.com',apiKeyEnv:'PEEKAPING_API_KEY'},subgroups:[{id:'web',name:{en:'Websites','zh-CN':'网站'},logo:null,slug:'default'}],monitors:{}});editGroup=draft.groups.length-1;viewGroup=editGroup;viewSub='all';detail=null;}
if(action==='remove-group'){if(draft.groups.length<2)return;draft.groups.splice(index,1);editGroup=Math.max(0,index-1);viewGroup=editGroup;viewSub='all';detail=null;}
if(action==='up-group'||action==='down-group'){const d=action==='up-group'?-1:1;move(draft.groups,index,d);editGroup=index+d;viewGroup=editGroup;}
if(action==='add-sub')g.subgroups.push({id:generate('sub-',g.subgroups.map(s=>s.id)),name:{en:'New subgroup','zh-CN':'新子分组'},logo:null,...(g.source.type==='peekaping'?{slug:'default'}:{monitorIds:['*']})});
if(action==='remove-sub')g.subgroups.splice(index,1);if(action==='up-sub')move(g.subgroups,index,-1);if(action==='down-sub')move(g.subgroups,index,1);
if(action==='add-monitor'){g.monitors??={};const candidates=g.source.type==='peekaping'?['web-home','web-blog','web-cdn','api-main','api-auth','api-cache']:['123456789','123456790','123456791'];const id=candidates.find(id=>!Object.hasOwn(g.monitors,id))||generate('monitor-',Object.keys(g.monitors));viewGroup=editGroup;viewSub='all';detail=null;g.monitors[id]={name:{en:'Custom name','zh-CN':'自定义名称'},description:{en:'Sample description','zh-CN':'自定义描述'}};}
if(action==='remove-monitor')delete g.monitors[Object.keys(g.monitors)[index]];
sync();renderEditor();}
$('editorBody').addEventListener('input',e=>{if(e.target.id==='jsonInput')parseJSON();else if(e.target.dataset.path)fieldInput(e.target)});
$('editorBody').addEventListener('change',e=>{if(e.target.dataset.monitorId){const group=draft.groups[editGroup],old=e.target.dataset.monitorId,id=e.target.value.trim();if(!id||Object.hasOwn(group.monitors,id)&&id!==old){e.target.value=old;toast('监控 ID 不能为空或重复');return;}group.monitors[id]=group.monitors[old];if(id!==old)delete group.monitors[old];sync();renderEditor();}});
$('editorBody').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.editLocale){editLocale=button.dataset.editLocale;renderEditor();}if(button.dataset.editGroup){editGroup=Number(button.dataset.editGroup);viewGroup=editGroup;viewSub='all';detail=null;renderEditor();renderPreview();}if(button.dataset.source){const g=draft.groups[editGroup],type=button.dataset.source;if(g.source.type===type)return;g.source=type==='peekaping'?{type,baseUrl:'https://monitor.example.com',apiKeyEnv:'PEEKAPING_API_KEY'}:{type,apiKeyEnv:'UPTIMEROBOT_API_KEY'};g.subgroups=g.subgroups.map(s=>({id:s.id,name:s.name,logo:s.logo,...(type==='peekaping'?{slug:s.id}:{monitorIds:['*']})}));sync();renderEditor();toast('已切换来源，子分组选择规则已重置');}if(button.dataset.toggle){const path=button.dataset.toggle;if(path==='cache-enabled'){draft.cache=draft.cache?.kvBinding?{}:{kvBinding:'UPTIMEPAGE_KV'};sync();renderEditor()}else{setPath(path,!getPath(draft,path));button.setAttribute('aria-pressed',!!getPath(draft,path));sync();}}if(button.dataset.mutation)mutation(button.dataset.mutation,Number(button.dataset.index));});
$('modes').onclick=e=>{const button=e.target.closest('[data-mode]');if(!button)return;if(button.dataset.mode==='form'&&mode==='json'&&errors.length){toast('请先修正 JSON');return}mode=button.dataset.mode;renderEditor();};
$('categories').onclick=e=>{const button=e.target.closest('[data-category]');if(!button)return;category=button.dataset.category;renderEditor();};
$('previewMain').addEventListener('click',e=>{const b=e.target.closest('[data-view-group],[data-view-sub],[data-detail],[data-action]');if(!b)return;if(b.dataset.viewGroup!==undefined){viewGroup=Number(b.dataset.viewGroup);viewSub='all';query='';}if(b.dataset.viewSub)viewSub=b.dataset.viewSub;if(b.dataset.detail)detail=b.dataset.detail;if(b.dataset.action==='back')detail=null;if(b.dataset.action==='refresh'){toast('已刷新模拟数据');return}swapContent($('previewMain'),renderPreview);});
$('previewMain').addEventListener('input',e=>{if(e.target.id==='searchPreview'){query=e.target.value;renderPreview()}});
$('previewMain').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.detail){detail=e.target.dataset.detail;swapContent($('previewMain'),renderPreview)}});
$('brand').onclick=e=>{e.preventDefault();detail=null;swapContent($('previewMain'),renderPreview)};
$('previewLocale').onclick=()=>{viewLocale=viewLocale==='en'?'zh-CN':'en';swapContent($('previewMain'),renderPreview)};$('previewTheme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};
$('editor').addEventListener('pointerenter',()=>{if(active)expand()});$('editor').addEventListener('pointerleave',scheduleDock);$('editor').addEventListener('focusin',()=>{if(active)expand()});$('editor').addEventListener('focusout',scheduleDock);document.addEventListener('pointerdown',e=>{if(!$('editor').contains(e.target)&&!['showEditor','previewTheme','previewLocale'].includes(e.target.id)){if($('editor').contains(document.activeElement))document.activeElement.blur();scheduleDock()}});
$('dockTab').onclick=expand;$('dockTab').onfocus=()=>{expand();$('pinEditor').focus({preventScroll:true})};$('showEditor').onclick=()=>{if(!active)enter();expand()};$('dockEditor').onclick=()=>{document.activeElement.blur();dock(true)};
$('pinEditor').onclick=()=>{pinned=!pinned;$('pinEditor').setAttribute('aria-pressed',pinned);$('pinEditor').style.color=pinned?'var(--accent)':'';$('pinEditor').title=pinned?'取消固定':'固定展开';toast(pinned?'已固定':'已取消固定');};
$('importConfig').onclick=()=>$('configFile').click();$('configFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;jsonText=await f.text();mode='json';renderEditor();parseJSON();e.target.value='';toast(errors.length?'已导入，配置待修正':'已导入')};
$('copyConfig').onclick=async()=>{const value=prepareExport();if(value===null)return;try{await navigator.clipboard.writeText(value);toast('已复制完整 JSON')}catch{mode='json';renderEditor();$('jsonInput').select();toast('复制受限，请按 Ctrl / ⌘ + C')}};
$('exportConfig').onclick=()=>{const value=prepareExport();if(value===null)return;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([value+'\n'],{type:'application/json'}));a.href=url;a.download='site.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 site.json')};
$('formatConfig').onclick=()=>{try{jsonText=JSON.stringify(JSON.parse(jsonText),null,2);$('jsonInput').value=jsonText;parseJSON();toast('JSON 已格式化')}catch{toast('JSON 语法有误')}};
function showMenu(open){const menu=$('menu');$('moreMenu').setAttribute('aria-expanded',open);for(const a of menu.getAnimations())a.cancel();if(open){menu.hidden=false;menu.animate([{opacity:0,transform:'translateY(-5px) scale(.97)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:250,easing:'cubic-bezier(.22,.8,.22,1)'})}else if(!menu.hidden){menu.animate([{opacity:1},{opacity:0,transform:'translateY(-4px) scale(.98)'}],{duration:150}).finished.then(()=>{menu.hidden=true}).catch(()=>{})}}$('moreMenu').onclick=()=>showMenu($('moreMenu').getAttribute('aria-expanded')!=='true');$('pasteIntoJSON').onclick=paste;$('resetConfig').onclick=()=>{draft=clone(example);valid=clone(example);jsonText=JSON.stringify(draft,null,2);errors=[];editGroup=viewGroup=0;viewSub='all';detail=null;showMenu(false);renderEditor();sync();toast('已恢复示例')};$('oldPrototype').onclick=()=>window.open(location.port==='58914'?'/files/config-editor-standalone.html':'config-editor-standalone.html','_blank');document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))showMenu(false)});

function editVisibility(open){
  const items=[['editor','0 8px'],[null,'0 -100%'],[null,'0 100%']];
  const elements=[$('editor'),document.querySelector('.edit-band'),document.querySelector('.bottom-band')];
  elements.forEach((element,index)=>{for(const a of element.getAnimations())a.cancel();if(open)element.hidden=false;const offset=items[index][1];const animation=element.animate(open?[{opacity:0,translate:offset},{opacity:1,translate:'0 0'}]:[{opacity:1,translate:'0 0'},{opacity:0,translate:offset}],{duration:reduced()?1:open?360:240,easing:'cubic-bezier(.22,.8,.22,1)'});animation.finished.then(()=>{if(!active)element.hidden=true}).catch(()=>{})})
}
function enter(){active=true;document.body.classList.remove('preview-off');$('restoreEditor').hidden=true;editVisibility(true);expand();}
$('exitPreview').onclick=()=>{active=false;document.body.classList.add('preview-off');editVisibility(false);$('restoreEditor').hidden=false;toast('已退出，草稿保留')};$('restoreEditor').onclick=enter;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){showMenu(false);if($('editor').contains(document.activeElement))document.activeElement.blur();dock(true)}});
for(const [id,name]of Object.entries({pasteIntoJSON:'paste',previewTheme:'moon',pinEditor:'pin',dockEditor:'right',importConfig:'import',copyConfig:'copy',moreMenu:'more'}))$(id).innerHTML=icon(name);$('exportConfig').innerHTML=icon('import')+'导出配置 JSON';

function showTip(target){const value=target.getAttribute('title')||target.dataset.tip;if(!value)return;target.dataset.tip=value;target.removeAttribute('title');const tip=$('uiTip');tip.textContent=value;const box=target.getBoundingClientRect();tip.style.left=Math.min(innerWidth-tip.offsetWidth-10,Math.max(10,box.left+(box.width-tip.offsetWidth)/2))+'px';tip.style.top=(box.top-tip.offsetHeight-8<40?box.bottom+7:box.top-tip.offsetHeight-8)+'px';tip.classList.add('visible')}
document.addEventListener('pointerover',e=>{const target=e.target.closest('[title],[data-tip]');if(target&&!target.contains(e.relatedTarget))showTip(target)});
document.addEventListener('pointerout',e=>{const target=e.target.closest('[title],[data-tip]');if(target&&!target.contains(e.relatedTarget))$('uiTip').classList.remove('visible')});
document.addEventListener('focusin',e=>{if(e.target.matches('[title],[data-tip]'))showTip(e.target)});
document.addEventListener('focusout',()=>$('uiTip').classList.remove('visible'));
document.addEventListener('pointerdown',()=>$('uiTip').classList.remove('visible'));
renderEditor();sync();scheduleDock();
})();
</script>
