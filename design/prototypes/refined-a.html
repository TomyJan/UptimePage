 $$('[data-window]').forEach(el=>el.onclick=()=>{if(el.dataset.window===windowSize)return;windowSize=el.dataset.window;$$('[data-window]').forEach(b=>{const active=b.dataset.window===windowSize;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active)});const route=location.hash.match(/^#\/services\/(core|external)\/(m\d+)$/),m=route&&monitors(route[1]).find(m=>m.id===route[2]);if(!m)return;runTransition('chart',()=>{const old=$('.chart-panel'),template=document.createElement('template');template.innerHTML=detail(route[1],route[2]);old.replaceWith(template.content.querySelector('.chart-panel'));fitChart();bind();$(`[data-window="${windowSize}"]`)?.focus({preventScroll:true})},{draw:true})});
}

function persist(){try{localStorage.setItem('uptimepage-design-prefs',JSON.stringify(prefs))}catch{}}

// One shared, animated menu. No native select or browser popup.
let menuTrigger=null,menuKey=null,menuCloseTimer=null,menuFrame=null;
function menuItems(key){
 if(key==='lang')return {label:t('language'),value:prefs.lang||'auto',items:[['auto',t('auto')],['zh','简体中文'],['en','English']]};
 if(key==='theme')return {label:t('appearance'),value:prefs.theme||'auto',items:[['auto',t('system'),'sun'],['light',t('light'),'sun'],['dark',t('dark'),'moon']]};
 if(key==='refresh')return {label:t('refreshSettings'),value:prefs.refresh===undefined?'auto':String(prefs.refresh),items:[['auto',t('siteDefault')+' · '+intervalLabel(prototypeConfig.refreshIntervalSeconds)],['0',t('manualOnly')],...([30,60,300].map(seconds=>[String(seconds),intervalLabel(seconds)]))]};
 if(key==='sample')return {label:t('sample'),value:String(sampleSize),items:[['10','10 '+t('quantity')],['50','50 '+t('quantity')]]};
 const items=[['auto',t('auto')],['UTC','UTC'],['Asia/Shanghai',language()==='zh'?'上海':'Shanghai'],['Asia/Singapore',language()==='zh'?'新加坡':'Singapore'],['Asia/Tokyo',language()==='zh'?'东京':'Tokyo'],['America/New_York',language()==='zh'?'纽约':'New York'],['Europe/London',language()==='zh'?'伦敦':'London']];
 return {label:t('timezone'),value:prefs.zone||'auto',items};
}
function zoneOffset(value){if(value==='auto')return '';try{return new Intl.DateTimeFormat('en',{timeZone:value,timeZoneName:'shortOffset'}).formatToParts(refreshedAt).find(p=>p.type==='timeZoneName').value.replace('GMT','UTC')}catch{return ''}}
function placeMenu(){const el=$('#floating-menu');if(!menuTrigger||!menuTrigger.isConnected)return;const r=menuTrigger.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;el.style.left=Math.max(12,Math.min(innerWidth-w-12,r.right-w))+'px';el.style.top=(r.bottom+h+10<=innerHeight-12?r.bottom+8:Math.max(12,r.top-h-8))+'px'}
function retireMenu(immediate=false){
 const menu=$('#floating-menu');if(!menu)return;
 clearTimeout(menuCloseTimer);cancelAnimationFrame(menuFrame);
 if(!menu.hidden&&!immediate&&!reducedMotion()){
  // Freeze the outgoing panel at its own anchor; the new panel never inherits
  // its coordinates, transform, height, animation, or closing timer.
  const style=getComputedStyle(menu),rect=menu.getBoundingClientRect(),ghost=menu.cloneNode(true),opacity=style.opacity;
  ghost.removeAttribute('id');ghost.removeAttribute('role');ghost.setAttribute('aria-hidden','true');ghost.inert=true;ghost.classList.add('menu-ghost');
  Object.assign(ghost.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',opacity,transform:'none',pointerEvents:'none',minWidth:'0'});
  document.body.appendChild(ghost);
  const animation=ghost.animate([{opacity,translate:'0 0'},{opacity:0,translate:'0 -5px'}],{duration:motion.menuOut,easing:'ease-out'});
  const cleanup=setTimeout(()=>ghost.remove(),motion.menuOut+80);animation.finished.catch(()=>{}).finally(()=>{clearTimeout(cleanup);ghost.remove()});
  $$('.menu-ghost').slice(0,-2).forEach(el=>el.remove());
 }
 menu.getAnimations().forEach(a=>a.cancel());menu.classList.remove('is-open');menu.hidden=true;
 menuTrigger?.setAttribute('aria-expanded','false');menuTrigger=null;menuKey=null;
}
function openMenu(trigger){
 if(menuTrigger===trigger&&!$('#floating-menu').hidden){closeMenu(true);return}
 retireMenu();hideTooltip(true);menuTrigger=trigger;menuKey=trigger.dataset.menu;
 trigger.setAttribute('aria-expanded','true');trigger.setAttribute('aria-controls','floating-menu');
 const data=menuItems(menuKey),menu=$('#floating-menu');menu.setAttribute('aria-label',data.label);
 menu.innerHTML=`<div class="menu-label">${data.label}</div>${data.items.map(([value,label,ico])=>`<button class="menu-option" role="menuitemradio" aria-checked="${data.value===value}" data-value="${value}" tabindex="-1"><span class="option-text">${ico?icon(ico,14):''}${label}</span>${menuKey==='zone'&&value!=='auto'?`<small>${zoneOffset(value)}</small>`:''}<span class="check">${icon('check',14)}</span></button>`).join('')}`;
 menu.hidden=false;menu.classList.add('is-open');placeMenu();
 if(!reducedMotion())menu.animate([{opacity:0,translate:'0 -7px',scale:'.985'},{opacity:1,translate:'0 0',scale:'1'}],{duration:motion.menuIn,easing:motion.ease});
 (menu.querySelector('[aria-checked=true]')||menu.querySelector('.menu-option')).focus({preventScroll:true});
}
function closeMenu(focus=false,immediate=false){const trigger=menuTrigger;retireMenu(immediate);if(immediate)$$('.menu-ghost').forEach(el=>el.remove());if(focus&&trigger?.isConnected)trigger.focus({preventScroll:true})}
function chooseOption(button){
 const value=button.dataset.value,key=menuKey;if(!key)return;closeMenu();
 if(key==='refresh'){prefs.refresh=value;persist();scheduleRefresh()}
 else if(key==='sample'){sampleSize=Number(value);syncChrome();runTransition('filter',swapGroup)}
 else{prefs[key]=value;persist();if(key==='theme'){applyTheme()}else{syncChrome();render()}}
 $(`[data-menu="${key}"]`)?.focus({preventScroll:true});
}

// Immediate tooltip updates while moving across history. Entry and exit animate,
// while position/content track the hovered sample without a dwell timer.
let tipTarget=null,tipAnchor=null,tipCloseTimer=null;
function tooltipData(el){const m=monitors().find(m=>m.id===el.dataset.monitor);if(!m)return null;if(el.dataset.tip==='uptime')return {heading:t('period'),state:m.uptime===null?'none':'operational',label:t('uptime'),value:m.uptime===null?'—':m.uptime+'%',note:m.uptime===null?t('noData'):displayName(m)};
 const count=Number(el.dataset.count),i=Number(el.dataset.index),state=bucket(m,i,count),from=new Date(refreshedAt.getTime()-86400000*(1-i/count)),to=new Date(refreshedAt.getTime()-86400000*(1-(i+1)/count)),fmt=new Intl.DateTimeFormat(language()==='zh'?'zh-CN':'en-GB',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:getZone()});
 const stateKey=state==='none'?'noData':state==='partial'?(language()==='zh'?'部分异常':'Partial outage'):state;
 return {heading:fmt.format(from)+' – '+new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:getZone()}).format(to),state,label:copy[language()][stateKey]||stateKey,value:state==='none'||state==='down'||m.latency===null?'—':(m.latency+Math.round(12*Math.sin(i+m.seed)))+' ms',note:null};
}
function placeTooltip(){if(!tipAnchor?.isConnected)return;const tip=$('#tooltip'),r=tipAnchor.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+'px';tip.style.top=(r.top-h-10>=12?r.top-h-10:Math.min(innerHeight-h-12,r.bottom+10))+'px'}
function showTooltip(el,anchor=el){if(!el?.isConnected)return;const data=tooltipData(el);if(!data)return;clearTimeout(tipCloseTimer);const tip=$('#tooltip'),wasHidden=tip.hidden;if(tipTarget&&tipTarget!==el)tipTarget.classList.remove('is-hovered');if(tipAnchor&&tipAnchor!==anchor)tipAnchor.removeAttribute('aria-describedby');tipTarget=el;tipAnchor=anchor;el.classList.add('is-hovered');anchor.setAttribute('aria-describedby','tooltip');tip.innerHTML=`<div class="tip-time"><span>${data.heading}</span></div><div class="tip-content"><span class="tip-status ${data.state}">${el.dataset.tip==='history'?'<i class="dot"></i>':''}${data.label}</span><strong class="tip-stat">${data.value}</strong></div>${data.note?`<div class="tip-note">${data.note}</div>`:''}`;tip.hidden=false;placeTooltip();if(wasHidden)tip.offsetWidth;tip.classList.add('is-open')}
function hideTooltip(immediate=false){clearTimeout(tipCloseTimer);const tip=$('#tooltip');if(!tip)return;tip.classList.remove('is-open');tipTarget?.classList.remove('is-hovered');tipAnchor?.removeAttribute('aria-describedby');tipTarget=null;tipAnchor=null;if(immediate||reducedMotion())tip.hidden=true;else tipCloseTimer=setTimeout(()=>tip.hidden=true,180)}
function tipFromEvent(target){return target instanceof Element?target.closest('[data-tip]'):null}
let touchPointer=false;
document.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const target=tipFromEvent(e.target);if(target)showTooltip(target)});
document.addEventListener('pointerout',e=>{if(e.pointerType==='touch')return;const from=tipFromEvent(e.target),to=tipFromEvent(e.relatedTarget);if(from&&from!==to){if(to)showTooltip(to);else hideTooltip()}});
document.addEventListener('focusin',e=>{if(e.target.matches('[data-tip=uptime]'))showTooltip(e.target);else if(e.target.matches('[data-history-keyboard]')){const bars=$$('.bar',e.target);showTooltip(bars.at(-1),e.target)}});
document.addEventListener('focusout',e=>{if(e.target.matches('[data-tip=uptime],[data-history-keyboard]'))hideTooltip()});
document.addEventListener('pointerdown',e=>{touchPointer=e.pointerType==='touch';if(touchPointer){const el=tipFromEvent(e.target);if(el){e.preventDefault();showTooltip(el)}else hideTooltip()}});
document.addEventListener('click',e=>{const option=e.target.closest('.menu-option');if(option){chooseOption(option);return}const trigger=e.target.closest('[data-menu]');if(trigger){openMenu(trigger);return}if(!e.target.closest('#floating-menu'))closeMenu();if(e.target.closest('.bars,[data-tip=uptime]')&&e.target.closest('.monitor')){e.preventDefault();if(touchPointer){const el=tipFromEvent(e.target)||$('.bar:last-child',e.target.closest('.bars'));if(el)showTooltip(el)}}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#floating-menu').hidden)closeMenu(true);hideTooltip(true);return}
 const menu=$('#floating-menu');if(!menu.hidden&&menu.contains(e.target)){
  const buttons=$$('.menu-option',menu),i=buttons.indexOf(document.activeElement);
  if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();buttons[e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus();return}
  if(e.key==='Tab')closeMenu(true);
 }
 const trigger=e.target.closest('[data-menu]');if(trigger&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();openMenu(trigger);return}
 const bars=e.target.closest('[data-history-keyboard]');if(bars&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const items=$$('.bar',bars),i=tipTarget&&items.includes(tipTarget)?items.indexOf(tipTarget):items.length-1,next=e.key==='Home'?0:e.key==='End'?items.length-1:Math.max(0,Math.min(items.length-1,i+(e.key==='ArrowRight'?1:-1)));showTooltip(items[next],bars)}
});
window.addEventListener('scroll',()=>{hideTooltip(true);closeMenu(false,true)},{passive:true});
let chartResizeFrame;
window.addEventListener('resize',()=>{hideTooltip(true);closeMenu(false,true);moveIndicator();cancelAnimationFrame(chartResizeFrame);chartResizeFrame=requestAnimationFrame(()=>{fitChart();layoutToasts()})},{passive:true});
window.addEventListener('blur',()=>{hideTooltip(true);closeMenu(false,true)});
window.addEventListener('hashchange',()=>render({page:true}));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!prefs.theme||prefs.theme==='auto')applyTheme()});
window.addEventListener('languagechange',()=>{if(!prefs.lang||prefs.lang==='auto')render()});
// The overlay never scrolls or clips shadows. Each card has its own position.
const toastEntries=new Map();let toastSequence=0,demoSequence=0;
function pauseToast(entry){clearTimeout(entry.timer);if(entry.started){entry.remaining=Math.max(0,entry.remaining-(performance.now()-entry.started));entry.started=0}}
function resumeToast(entry){if(!entry.visible||entry.closing||entry.hovered||entry.focused||document.hidden||entry.started)return;entry.started=performance.now();entry.timer=setTimeout(()=>dismissToast(entry.id),entry.remaining)}
function layoutToasts(){
 const entries=[...toastEntries.values()],before=new Map(entries.filter(e=>e.visible).map(e=>[e.id,e.el.getBoundingClientRect().top]));
 const edge=innerWidth<=600?12:24,available=innerHeight-edge*2;let occupied=0,visible=0;
 for(const entry of entries){
  const el=entry.el,wasVisible=entry.visible;el.getAnimations().filter(a=>a.id==='toast-layout').forEach(a=>a.cancel());
  el.hidden=false;el.style.visibility='hidden';const height=el.offsetHeight;
  // Pending notices retain their full timer until a slot becomes available.
  const fits=visible<5&&(occupied+height<=available||visible===0);
  if(!fits){el.hidden=true;el.style.visibility='';entry.visible=false;pauseToast(entry);continue}
  el.style.bottom=`calc(max(${edge}px, env(safe-area-inset-bottom)) + ${occupied}px)`;el.style.visibility='';entry.visible=true;occupied+=height+10;visible++;
  if(!reducedMotion()&&!entry.closing){
   if(!wasVisible)el.animate([{opacity:0,transform:'translateY(10px) scale(.985)'},{opacity:1,transform:'translateY(0) scale(1)'}],{duration:320,easing:motion.ease});
   else{const delta=before.get(entry.id)-el.getBoundingClientRect().top;if(Math.abs(delta)>.5){const a=el.animate([{translate:`0 ${delta}px`},{translate:'0 0'}],{duration:320,easing:motion.ease});a.id='toast-layout'}}
  }
  if(!wasVisible){$('#announcements').textContent=$('.toast-message',el).textContent;resumeToast(entry)}
 }
}
function dismissToast(id){
 const entry=toastEntries.get(id);if(!entry||entry.closing)return;entry.closing=true;pauseToast(entry);entry.el.inert=true;
 const remove=()=>{if(!toastEntries.has(id))return;clearTimeout(entry.cleanup);entry.el.remove();toastEntries.delete(id);layoutToasts()};
 if(!entry.visible||reducedMotion()){remove();return}
 const animation=entry.el.animate([{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX(12px)'}],{duration:200,easing:'ease-out',fill:'forwards'});
 entry.cleanup=setTimeout(remove,260);animation.finished.catch(()=>{}).then(remove);
}
function toast(message,{tone='success',duration=5000}={}){
 const id=++toastSequence,el=document.createElement('div');el.className='toast';el.dataset.tone=tone;el.hidden=true;
 el.innerHTML=`<span class="toast-icon">${icon(tone==='success'?'check':tone==='warning'?'alert':'info',18)}</span><span class="toast-message"></span><button class="toast-close" aria-label="${t('dismiss')}">${icon('close',15)}</button>`;
 $('.toast-message',el).textContent=message;
 const entry={id,el,origin:document.activeElement,remaining:duration,started:0,timer:null,closing:false,hovered:false,focused:false,visible:false};toastEntries.set(id,entry);
 el.addEventListener('pointerenter',()=>{entry.hovered=true;pauseToast(entry)});el.addEventListener('pointerleave',()=>{entry.hovered=false;resumeToast(entry)});
 el.addEventListener('focusin',()=>{entry.focused=true;pauseToast(entry)});el.addEventListener('focusout',e=>{entry.focused=el.contains(e.relatedTarget);if(!entry.focused)resumeToast(entry)});
 $('.toast-close',el).onclick=()=>{const next=[...toastEntries.values()].find(e=>e.id!==id&&e.visible&&!e.closing)?.el.querySelector('.toast-close')||(entry.origin?.isConnected?entry.origin:$('#toast-demo'));if(el.contains(document.activeElement))next?.focus({preventScroll:true});dismissToast(id)};
 $('#feedback').appendChild(el);layoutToasts();return id;
}
function showDemoToast(){const samples=[[t('refreshDone'),'success'],[t('demoPreference'),'info'],[t('demoDelayed'),'warning']],item=samples[demoSequence++%samples.length];toast(item[0],{tone:item[1]})}
document.addEventListener('visibilitychange',()=>toastEntries.forEach(entry=>document.hidden?pauseToast(entry):resumeToast(entry)));

scheduleRefresh();
render({page:true});
